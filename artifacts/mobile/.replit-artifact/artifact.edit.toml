kind = "mobile"
previewPath = "/"
title = "AutoNXT Fleet"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
EXPO_PUBLIC_COGNITO_USER_POOL_ID = "$COGNITO_USER_POOL_ID"
EXPO_PUBLIC_COGNITO_CLIENT_ID = "$COGNITO_CLIENT_ID"
EXPO_PUBLIC_AWS_REGION = "$AWS_REGION"
EXPO_PUBLIC_APPSYNC_ENDPOINT = "$APPSYNC_ENDPOINT"
EXPO_PUBLIC_APPSYNC_API_KEY = "$APPSYNC_API_KEY"
