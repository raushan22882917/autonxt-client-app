# dashboard.yaml
appId: com.softwareautonxt.mobile
env:
  EMAIL: "testuser@example.com"
  PASSWORD: "Password123"
---
- runFlow: subflows/login_if_needed.yaml
- assertVisible: "Fleet Overview"
- assertVisible: "Total Fleet"
- assertVisible: "Open Tickets"
- assertVisible: "Cost Saved"
- assertVisible: "Recent Activity"
