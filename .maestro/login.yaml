# login.yaml
appId: com.softwareautonxt.mobile
env:
  EMAIL: "raushan@autonxt.in"
  PASSWORD: "Raushan@2288"
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "AutoNXT Fleet"
    timeout: 60000
- assertNotVisible: "AutoNXT Fleet"
- runFlow:
    commands:
      - tapOn: "Profile"
      - tapOn: "Sign Out"
    when:
      visible: "Fleet Overview"
- assertVisible: "Welcome Back"
- assertVisible: "Email Address"
- assertVisible: "Password"
- runFlow: subflows/login_action.yaml
- assertVisible: "Fleet Overview"
- tapOn: "Profile"
- assertVisible: "Account"
- assertVisible: "Organization"
- tapOn: "Sign Out"
- assertVisible: "Welcome Back"
- tapOn: "AutoNxt Pvt Limited"
