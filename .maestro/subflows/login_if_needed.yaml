# login_if_needed.yaml
appId: com.softwareautonxt.mobile
---
- launchApp

# 1. Wait up to 10 seconds to see if the Login Screen appears.
# This is marked optional so it doesn't fail if the user is already logged in (which goes straight to Dashboard).
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 10000
  optional: true

# 2. If the Login Screen is visible, run the login subflow.
- runFlow:
    file: login_action.yaml
    when:
      visible: "Welcome Back"

# 3. Assert that we successfully reach the dashboard
- extendedWaitUntil:
    visible: "Fleet Overview"
    timeout: 30000

- assertVisible: "Fleet Overview"
