# admin_users.yaml
appId: com.softwareautonxt.mobile
env:
  EMAIL: "testuser@example.com"
  PASSWORD: "Password123"
---
- runFlow: subflows/login_if_needed.yaml
- tapOn: "Profile"
- assertVisible: "Account"
# Conditionally navigate to Manage Users if visible (Admin user only)
- runFlow:
    when:
      visible: "Manage Users"
    commands:
      - tapOn: "Manage Users"
      - assertVisible: "Team Members"
      - assertVisible: "Search by name, email, role…"
      - tapOn: "Search by name, email, role…"
      - inputText: "admin"
      - assertVisible: "admin"
      - back
- back
- assertVisible: "Fleet Overview"
