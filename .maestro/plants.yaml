# plants.yaml
appId: com.softwareautonxt.mobile
env:
  EMAIL: "testuser@example.com"
  PASSWORD: "Password123"
---
- runFlow: subflows/login_if_needed.yaml
- tapOn: "Plants"
- assertVisible: "Plant Analysis"
- assertVisible: "All Plants"
# Tap on a plant card chevron
- tapOn: "chevron-right"
# Inside plant detail, check tabs and switch them
- assertVisible: "Fleet uptime"
- tapOn: "Breakdown"
- tapOn: "Tickets"
- tapOn: "Runtime"
- tapOn: "Tractors"
- back
- assertVisible: "Plant Analysis"
